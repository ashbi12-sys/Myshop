<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Shop Admin</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>Shop Admin</h1><p class="sub"><a href="index.html">← View shop</a></p></header>
<main id="app"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const K="shopAdminLogin";
let cfg=JSON.parse(localStorage.getItem(K)||"null"),data={shop:{},items:[]},sha=null,form=null,msg="",busy=false,armed=null,showShop=false;
const enc=s=>btoa(unescape(encodeURIComponent(s))),dec=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
const api=(p,o={})=>fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${p}`,{...o,headers:{Authorization:"Bearer "+cfg.token,Accept:"application/vnd.github+json","Content-Type":"application/json"}});
async function load(){
  const r=await api("items.json?_="+Date.now());
  if(r.status===404){data={shop:{},items:[]};sha=null;return}
  if(!r.ok)throw new Error(r.status===401||r.status===403?"GitHub refused the token. Check it has Contents read & write for this repo.":"Could not read the repo ("+r.status+").");
  const j=await r.json();sha=j.sha;data=JSON.parse(dec(j.content));data.items=data.items||[];data.shop=data.shop||{};
}
async function saveData(m){
  const r=await api("items.json",{method:"PUT",body:JSON.stringify({message:m,content:enc(JSON.stringify(data,null,2)),sha:sha||undefined})});
  if(!r.ok)throw new Error("Save failed ("+r.status+"). Reload the page and try again.");
  sha=(await r.json()).content.sha;
}
async function putPhoto(path,b64){
  const r=await api(path,{method:"PUT",body:JSON.stringify({message:"Add photo",content:b64})});
  if(!r.ok)throw new Error("Photo upload failed ("+r.status+").");
}
const shrink=f=>new Promise(res=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement("canvas");
  c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext("2d").drawImage(i,0,0,c.width,c.height);
  c.toBlob(b=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(b)},"image/jpeg",.82)};i.src=URL.createObjectURL(f)});

function draw(){
  const a=document.getElementById("app");
  if(!cfg){a.innerHTML=`<div class="panel"><h2>Connect to your GitHub repo</h2>
    <p class="note">Stored only in this browser. Never share your token.</p>
    <label>GitHub username</label><input type="text" id="o"><label>Repository name</label><input type="text" id="r">
    <label>Personal access token (Contents: read &amp; write)</label><input type="password" id="t">
    <p class="note" style="color:#dc2626">${esc(msg)}</p><div class="row"><button class="primary" data-a="login">Connect</button></div></div>`;return}
  let h=`<div class="row" style="margin:0 0 16px"><button class="primary" data-a="new">+ Add item</button><button data-a="shop">Shop settings</button><button data-a="logout">Log out</button></div>`;
  if(msg)h+=`<p class="note">${esc(msg)}</p>`;
  if(showShop)h+=`<div class="panel"><h2>Shop settings</h2><label>Shop name</label><input type="text" id="sn" value="${esc(data.shop.name)}">
    <label>Tagline</label><input type="text" id="st" value="${esc(data.shop.tagline)}">
    <label>Contact for buyers (email, link, or phone/Messenger)</label><input type="text" id="sc" value="${esc(data.shop.contact)}">
    <div class="row"><button class="primary" data-a="saveShop">Save</button></div></div>`;
  if(form)h+=`<div class="panel"><h2>${form.id?"Edit item":"New item"}</h2>
    <label>Item name</label><input type="text" id="ft" value="${esc(form.title)}"><label>Price (e.g. ₱500)</label><input type="text" id="fp" value="${esc(form.price)}">
    <label>Description</label><textarea id="fd">${esc(form.desc)}</textarea><label>Photos</label><input type="file" id="ff" accept="image/*" multiple>
    <div class="prev">${form.photos.map((p,i)=>`<div><img src="${esc(p.src)}" alt=""><button data-a="rm" data-i="${i}">×</button></div>`).join("")}</div>
    <div class="row"><button class="primary" data-a="save" ${busy?"disabled":""}>${busy?"Saving…":"Publish"}</button><button data-a="cancel">Cancel</button></div></div>`;
  h+=`<h2>Items (${data.items.length})</h2>`+data.items.map(it=>`<div class="panel"><b>${esc(it.title)}</b> · ${esc(it.price)} ${it.sold?"· SOLD":""}
    <div class="row"><button data-a="edit" data-id="${it.id}">Edit</button><button data-a="sold" data-id="${it.id}">${it.sold?"Mark available":"Mark sold"}</button>
    <button class="danger" data-a="del" data-id="${it.id}">${armed===it.id?"Tap again to delete":"Delete"}</button></div></div>`).join("");
  a.innerHTML=h;
  const f=document.getElementById("ff");if(f)f.onchange=async e=>{keep();for(const file of e.target.files){const u=await shrink(file);form.photos.push({src:u,b64:u.split(",")[1]})}draw()};
}
const v=id=>document.getElementById(id)?.value??"";
function keep(){if(form&&document.getElementById("ft")){form.title=v("ft");form.price=v("fp");form.desc=v("fd")}}
async function run(fn,ok){busy=true;msg="Working…";draw();try{await fn();msg=ok||""}catch(e){msg=e.message}busy=false;draw()}

document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id,it=data.items.find(x=>x.id===id);
  if(a==="login"){cfg={owner:v("o").trim(),repo:v("r").trim(),token:v("t").trim()};
    try{await load();localStorage.setItem(K,JSON.stringify(cfg));msg=""}catch(x){msg=x.message;cfg=null}draw()}
  else if(a==="logout"){localStorage.removeItem(K);cfg=null;draw()}
  else if(a==="new"){form={title:"",price:"",desc:"",photos:[]};draw()}
  else if(a==="edit"){form={id,title:it.title,price:it.price,desc:it.desc,photos:(it.photos||[]).map(p=>({src:p,path:p}))};draw();scrollTo(0,0)}
  else if(a==="cancel"){form=null;draw()}
  else if(a==="rm"){keep();form.photos.splice(+b.dataset.i,1);draw()}
  else if(a==="shop"){showShop=!showShop;draw()}
  else if(a==="saveShop")run(async()=>{data.shop={name:v("sn").trim(),tagline:v("st").trim(),contact:v("sc").trim()};await saveData("Update shop settings");showShop=false},"Saved. The live site updates in about a minute.");
  else if(a==="sold")run(async()=>{it.sold=!it.sold;await saveData("Toggle sold")},"Saved.");
  else if(a==="del"){if(armed===id){armed=null;run(async()=>{data.items=data.items.filter(x=>x.id!==id);await saveData("Delete item")},"Deleted.")}else{armed=id;draw();setTimeout(()=>{armed=null;draw()},3500)}}
  else if(a==="save"){keep();if(!form.title.trim()){msg="Please enter an item name.";draw();return}
    run(async()=>{const iid=form.id||("i"+Date.now());const paths=[];let n=0;
      for(const p of form.photos){if(p.path)paths.push(p.path);else{const path=`photos/${iid}-${Date.now()}-${n++}.jpg`;await putPhoto(path,p.b64);paths.push(path)}}
      const rec={id:iid,title:form.title.trim(),price:form.price.trim(),desc:form.desc.trim(),photos:paths,sold:form.sold||false,createdAt:form.createdAt||Date.now()};
      const old=data.items.find(x=>x.id===iid);if(old)Object.assign(old,rec,{sold:old.sold,createdAt:old.createdAt});else data.items.push(rec);
      await saveData((old?"Edit ":"Add ")+rec.title);form=null},"Published. The live site updates in about a minute.")}
});
if(cfg)load().then(draw).catch(e=>{msg=e.message;cfg=null;draw()});else draw();
</script></body></html>
